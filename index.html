<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#14231f">
    <meta name="description" content="Challenge your friends to a fast, live game of Bulls & Cows. One shared code, one ticking clock, one winner.">
    <title>Bulls & Cows — Crack it first</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/config.js"></script>
    <script src="/app.js" defer></script>

  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Bulls and Cows home">
          <span class="brand-mark" aria-hidden="true">

          </span>

        <nav class="top-nav" aria-label="Main navigation">
          <a href="#how-to-play">How to play</a>
          <span class="nav-divider"></span>

        </nav>
        <button class="button button-small button-ink" type="button" data-action="create">Play with friends <span aria-hidden="true">↗</span></button>

      <main id="screen" class="screen" aria-live="polite"></main>

      <footer class="footer">

        <a href="#how-to-play">THE RULES <span aria-hidden="true">↗</span></a>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
